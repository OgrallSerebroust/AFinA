[project]
name = "afina-feature-get-market-data"
version = "0.1.0"
description = "Trading analytics platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.84.1",
    "grpcio-tools>=1.84.1",
    "protobuf>=7.36.2",
    "pydantic-settings>=2.16.1",
    "ruff>=0.17.1",
]

[tool.ruff]
exclude = [
    ".venv",
    "__pycache__",
]
indent-width = 4
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "FURB", "I", "N", "PL", "RUF", "TRY", "UP", "W"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
